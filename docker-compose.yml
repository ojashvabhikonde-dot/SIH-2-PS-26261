version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sih26261_postgres
    restart: always
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: sih26261_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih26261_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: sih26261_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./storage/uploads:/app/storage/uploads

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih26261_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://sih_user:sih_password@db:5432/sih26261_db
      JWT_SECRET: sih26261-super-secure-secret-key-2026
      AI_SERVICE_URL: http://ai-service:8000
      STORAGE_DIR: /app/storage/uploads
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./storage/uploads:/app/storage/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih26261_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
